name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: fmt + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Build Web Frontend
        run: |
          cd web
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-15
            target: darwin-aarch64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Build Web Frontend
        run: |
          cd web
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --bin niocm
      - name: Smoke test niocm
        if: runner.os == 'Linux'
        run: node scripts/smoke-test.mjs target/release/niocm
