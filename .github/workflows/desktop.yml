name: Desktop Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
    env:
      # Optional macOS signing / notarization. When unset, Tauri falls back to
      # ad-hoc signing, which is fine for testing but not for distribution.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ./src-tauri"

      - name: Install dependencies (tooling)
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (web)
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build Web Frontend
        run: pnpm build
        working-directory: web

      - name: Build niocm daemon (sidecar)
        run: cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }}

      - name: Stage sidecar binary for Tauri
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/niocm.exe" \
               "src-tauri/binaries/niocm-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/niocm" \
               "src-tauri/binaries/niocm-${{ matrix.target }}"
          fi

      - name: Build desktop app
        shell: bash
        run: |
          [ -z "$APPLE_CERTIFICATE" ] && unset APPLE_CERTIFICATE || true
          [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && unset APPLE_CERTIFICATE_PASSWORD || true
          [ -z "$APPLE_SIGNING_IDENTITY" ] && unset APPLE_SIGNING_IDENTITY || true
          [ -z "$APPLE_ID" ] && unset APPLE_ID || true
          [ -z "$APPLE_PASSWORD" ] && unset APPLE_PASSWORD || true
          [ -z "$APPLE_TEAM_ID" ] && unset APPLE_TEAM_ID || true
          pnpm exec tauri build --target ${{ matrix.target }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p desktop-dist
          find target src-tauri/target -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) -path "*/bundle/*" -exec cp -f {} desktop-dist/ \; 2>/dev/null || true
          cp -f target/${{ matrix.target }}/release/bundle/deb/*.deb desktop-dist/ 2>/dev/null || true
          cp -f target/${{ matrix.target }}/release/bundle/appimage/*.AppImage desktop-dist/ 2>/dev/null || true
          cp -f target/${{ matrix.target }}/release/bundle/dmg/*.dmg desktop-dist/ 2>/dev/null || true
          cp -f target/${{ matrix.target }}/release/bundle/msi/*.msi desktop-dist/ 2>/dev/null || true
          cp -f target/${{ matrix.target }}/release/bundle/nsis/*.exe desktop-dist/ 2>/dev/null || true
          cp -f src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb desktop-dist/ 2>/dev/null || true
          cp -f src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage desktop-dist/ 2>/dev/null || true
          cp -f src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg desktop-dist/ 2>/dev/null || true
          cp -f src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi desktop-dist/ 2>/dev/null || true
          cp -f src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe desktop-dist/ 2>/dev/null || true
          ls -la desktop-dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: niocm-desktop-${{ matrix.name }}
          path: desktop-dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: niocm-desktop-*
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NioCM ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.exe
