<!-- Concept A.3: The Command Underline (Echoing NioDE's Horizontal Bar)
     Chevron stroke + bottom horizontal cursor bar (identical radius & weight to NioDE).
     Creates the most direct harmonious bridge with NioDE's iconic underline pill. -->
<svg width="2042" height="2042" viewBox="0 0 2042 2042" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="2042" height="2042" rx="420" fill="#008080"/>
  <!-- Elegant Command Chevron -->
  <path d="M540 680L900 1000L540 1320" stroke="white" stroke-width="160" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Classic Terminal Underline Cursor (Direct NioDE sibling pill) -->
  <rect x="1080" y="1220" width="540" height="180" rx="90" fill="white"/>
</svg>
