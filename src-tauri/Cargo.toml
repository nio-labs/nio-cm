[package]
name = "niocm-desktop"
version = "0.3.0"
description = "NioCM desktop shell — hosts the niocm daemon as a bundled sidecar"
authors = ["Nio Labs Team"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "niocm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
